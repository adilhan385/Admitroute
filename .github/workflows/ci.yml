name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency Security Audit
        run: npm run audit

      - name: Code Linting (oxlint)
        run: npm run lint

      - name: TypeScript Typecheck
        run: npx tsc -b

      - name: Automated Unit & Security Tests (vitest)
        run: npm test

      - name: Production Build (Vite)
        run: npm run build
